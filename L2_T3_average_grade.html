<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Завдання 3</title>
</head>
<body>

<script>
  let a = Number(prompt("Оцінка 1:"));
  let b = Number(prompt("Оцінка 2:"));
  let c = Number(prompt("Оцінка 3:"));
  let avg = (a + b + c) / 3;

  let div = document.createElement("div");
  div.id = "5"; // номер у журналі
  div.textContent = "Середній бал: " + avg.toFixed(2);
  document.body.appendChild(div);
</script>

</body>
</html>

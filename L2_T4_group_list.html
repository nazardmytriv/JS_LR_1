<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Завдання 4</title>
</head>
<body>

<script>
  let n = Number(prompt("Скільки студентів у групі?"));

  for (let i = 1; i <= n; i++) {
    let s = prompt("Прізвище і ім'я студента " + i);
    document.write(s + "<br>");
  }
</script>

</body>
</html>

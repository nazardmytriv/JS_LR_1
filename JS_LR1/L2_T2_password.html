<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Завдання 2</title>
</head>
<body>

<div id="out"></div>

<script>
  function getPassword(name, num) {
    return name.slice(0, 3) + num * 2;
  }

  let pass = getPassword("Назар", 5);
  document.getElementById("out").innerHTML = "Пароль: " + pass;
</script>

</body>
</html>

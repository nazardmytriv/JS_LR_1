<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Завдання 3</title>
</head>
<body>

<script>
  let n = 5; // остання цифра номера в журналі

  document.write("Таблиця множення для " + n + "<br>");
  for (let i = 1; i <= 10; i++) {
    document.write(n + " x " + i + " = " + (n * i) + "<br>");
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Завдання 1</title>
</head>
<body>

<div id="out"></div>

<script>
  function checkParity(n) {
    let p = document.createElement("p");
    if (n % 2 === 0) {
      p.style.color = "green";
      p.textContent = n + " - парне";
    } else {
      p.style.color = "red";
      p.textContent = n + " - непарне";
    }
    document.getElementById("out").appendChild(p);
  }

  checkParity(5); // номер у журналі
</script>

</body>
</html>
